<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#07061a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Space Invader Roguelike</title>
    <link rel="icon" href="data:," />
    <style>
      /* Read by src/view.ts; a test can override it where no device inset exists. */
      :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
      html, body { margin: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #07061a; }
      /* The canvas takes every touch itself: no scroll, pinch, bounce, text selection, callout or tap flash. */
      html, body, #game, #game canvas {
        touch-action: none;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; }
      #game canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
